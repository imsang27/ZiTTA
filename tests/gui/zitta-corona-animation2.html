<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZiTTA 코로나 애니메이션</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #08080C;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 20px;
        }

        #canvas {
            border-radius: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            image-rendering: crisp-edges;
        }

        .controls {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .cycle-btn {
            background: #FF6A8A;
            color: white;
        }

        .cycle-btn:hover {
            background: #FF2E2E;
            transform: translateY(-2px);
        }

        .state-btn {
            background: #1f1f23;
            color: #999;
        }

        .state-btn:hover {
            background: #2a2a2f;
        }

        .state-btn.active {
            background: #FF6A8A;
            color: white;
        }

        .info {
            margin-top: 20px;
            color: #FF6A8A;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="800" height="800"></canvas>
    
    <div class="controls">
        <button class="cycle-btn" onclick="cycleState()">
            상태 전환: <span id="current-state">IDLE</span>
        </button>
        
        <button class="state-btn active" onclick="setState('idle')">idle</button>
        <button class="state-btn" onclick="setState('wake')">wake</button>
        <button class="state-btn" onclick="setState('thinking')">thinking</button>
        <button class="state-btn" onclick="setState('resolve')">resolve</button>
    </div>

    <div class="info">
        <p id="state-info">💭 Idle: 미세한 호흡, 차분한 존재감</p>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        let currentState = 'idle';
        let particles = [];
        let ribbonStrands = [];
        let sparks = [];
        let time = 0;
        let animationFrame = null;

        const CONFIG = {
            centerX: 400,
            centerY: 400,
            baseRadius: 150,
            colors: {
                mainPink: '#FF6A8A',
                subRed: '#FF2E2E',
                highlight: '#F3F4F6',
                background: '#08080C'
            },
            ribbon: {
                strandCount: 12,
                opacity: 0.08,
                flowSpeed: 0.0003
            },
            particles: {
                idle: { count: 150, speed: 0.3, spread: 0.4 },
                wake: { count: 250, speed: 0.5, spread: 0.6 },
                thinking: { count: 400, speed: 0.7, spread: 1.0 },
                resolve: { count: 100, speed: 0.2, spread: 0.3 }
            }
        };

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 255, g: 106, b: 138 };
        }

        function lerpColor(color1, color2, t) {
            const c1 = hexToRgb(color1);
            const c2 = hexToRgb(color2);
            return {
                r: Math.round(c1.r + (c2.r - c1.r) * t),
                g: Math.round(c1.g + (c2.g - c1.g) * t),
                b: Math.round(c1.b + (c2.b - c1.b) * t)
            };
        }

        function createParticle(angle, radius) {
            const config = CONFIG.particles[currentState];
            
            const x = CONFIG.centerX + Math.cos(angle) * radius;
            const y = CONFIG.centerY + Math.sin(angle) * radius;
            
            const tangentAngle = angle + Math.PI / 2;
            const outwardAngle = angle;
            
            const tangentSpeed = config.speed * (0.3 + Math.random() * 0.4);
            const outwardSpeed = config.speed * config.spread * (0.2 + Math.random() * 0.3);
            
            const brownianX = (Math.random() - 0.5) * 0.1;
            const brownianY = (Math.random() - 0.5) * 0.1;
            
            return {
                x: x,
                y: y,
                vx: Math.cos(tangentAngle) * tangentSpeed + Math.cos(outwardAngle) * outwardSpeed + brownianX,
                vy: Math.sin(tangentAngle) * tangentSpeed + Math.sin(outwardAngle) * outwardSpeed + brownianY,
                life: 1.0,
                maxLife: 180 + Math.random() * 120,
                size: 0.3 + Math.random() * 0.7,
                colorMix: Math.random() < 0.8 ? 0 : Math.random() * 0.3,
                returnToCenter: currentState === 'thinking' && Math.random() < 0.15
            };
        }

        function createRibbonStrand(index, total) {
            const points = [];
            const segments = 120;
            const phaseOffset = (index / total) * Math.PI * 2;
            
            for (let i = 0; i <= segments; i++) {
                const angle = (i / segments) * Math.PI * 2;
                points.push({
                    angle: angle,
                    radiusOffset: 0,
                    phase: phaseOffset
                });
            }
            
            return {
                points: points,
                opacity: CONFIG.ribbon.opacity * (0.7 + Math.random() * 0.3),
                colorMix: index / total * 0.2
            };
        }

        function createSpark() {
            const angle = Math.random() * Math.PI * 2;
            const radius = CONFIG.baseRadius + (Math.random() - 0.5) * 20;
            
            return {
                x: CONFIG.centerX + Math.cos(angle) * radius,
                y: CONFIG.centerY + Math.sin(angle) * radius,
                vx: Math.cos(angle) * (1 + Math.random()),
                vy: Math.sin(angle) * (1 + Math.random()),
                life: 1.0,
                maxLife: 20 + Math.random() * 15,
                length: 3 + Math.random() * 5
            };
        }

        function init() {
            // Initialize ribbon strands
            for (let i = 0; i < CONFIG.ribbon.strandCount; i++) {
                ribbonStrands.push(createRibbonStrand(i, CONFIG.ribbon.strandCount));
            }

            // Initialize particles
            for (let i = 0; i < CONFIG.particles.idle.count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = CONFIG.baseRadius + (Math.random() - 0.5) * 10;
                particles.push(createParticle(angle, radius));
            }

            animate();
        }

        function animate() {
            time += 1;
            const particleConfig = CONFIG.particles[currentState];

            // Semi-transparent overlay for trail effect
            ctx.fillStyle = 'rgba(8, 8, 12, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // State-based pulse
            let pulseScale = 1.0;
            if (currentState === 'idle') {
                pulseScale = 1.0 + Math.sin(time * 0.01) * 0.005;
            } else if (currentState === 'wake') {
                pulseScale = 1.0 + Math.sin(time * 0.05) * 0.015;
            }

            // Draw ribbon strands
            ctx.globalCompositeOperation = 'lighter';
            ribbonStrands.forEach(strand => {
                ctx.beginPath();
                strand.points.forEach((point, i) => {
                    const waveOffset = Math.sin(time * CONFIG.ribbon.flowSpeed + point.phase + point.angle * 3) * 3;
                    const radius = (CONFIG.baseRadius + waveOffset) * pulseScale;
                    const x = CONFIG.centerX + Math.cos(point.angle) * radius;
                    const y = CONFIG.centerY + Math.sin(point.angle) * radius;
                    
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });
                ctx.closePath();

                const color = lerpColor(CONFIG.colors.mainPink, CONFIG.colors.subRed, strand.colorMix);
                ctx.strokeStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${strand.opacity})`;
                ctx.lineWidth = 1.5;
                ctx.stroke();
            });

            // Particle management
            const targetCount = particleConfig.count;
            while (particles.length < targetCount) {
                const angle = Math.random() * Math.PI * 2;
                const radius = CONFIG.baseRadius + (Math.random() - 0.5) * 10;
                particles.push(createParticle(angle, radius));
            }

            // Update and draw particles
            particles = particles.filter(p => {
                // Brownian motion
                p.vx += (Math.random() - 0.5) * 0.03;
                p.vy += (Math.random() - 0.5) * 0.03;

                // Return to center behavior
                if (p.returnToCenter) {
                    const dx = CONFIG.centerX - p.x;
                    const dy = CONFIG.centerY - p.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > 50) {
                        p.vx += dx / dist * 0.01;
                        p.vy += dy / dist * 0.01;
                    }
                }

                // Velocity damping
                p.vx *= 0.99;
                p.vy *= 0.99;

                p.x += p.vx;
                p.y += p.vy;
                p.life -= 1;

                const alpha = Math.min(1, p.life / p.maxLife);
                const fadeAlpha = alpha < 0.3 ? alpha / 0.3 : 1;

                const color = lerpColor(CONFIG.colors.mainPink, CONFIG.colors.subRed, p.colorMix);
                ctx.fillStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${fadeAlpha * 0.6})`;
                ctx.fillRect(p.x, p.y, p.size, p.size);

                return p.life > 0;
            });

            // Spark generation (rare)
            if (Math.random() < 0.01 && currentState !== 'resolve') {
                sparks.push(createSpark());
            }

            // Update and draw sparks
            sparks = sparks.filter(s => {
                s.x += s.vx;
                s.y += s.vy;
                s.life -= 1;

                const alpha = s.life / s.maxLife;
                const color = hexToRgb(CONFIG.colors.highlight);
                
                ctx.strokeStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${alpha * 0.4})`;
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(s.x, s.y);
                ctx.lineTo(s.x - s.vx * s.length, s.y - s.vy * s.length);
                ctx.stroke();

                return s.life > 0;
            });

            ctx.globalCompositeOperation = 'source-over';
            animationFrame = requestAnimationFrame(animate);
        }

        function setState(newState) {
            currentState = newState;
            
            // Update UI
            document.getElementById('current-state').textContent = newState.toUpperCase();
            
            document.querySelectorAll('.state-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            const stateInfos = {
                idle: '💭 Idle: 미세한 호흡, 차분한 존재감',
                wake: '👁️ Wake: 집중하며 깨어남',
                thinking: '🔥 Thinking: 사고가 열로 확산되며 흐름',
                resolve: '✨ Resolve: 생각 정리 완료'
            };
            
            document.getElementById('state-info').textContent = stateInfos[newState];
            
            if (newState === 'resolve') {
                setTimeout(() => setState('idle'), 3000);
            }
        }

        function cycleState() {
            const states = ['idle', 'wake', 'thinking', 'resolve'];
            const currentIndex = states.indexOf(currentState);
            const nextIndex = (currentIndex + 1) % states.length;
            
            currentState = states[nextIndex];
            document.getElementById('current-state').textContent = currentState.toUpperCase();
            
            document.querySelectorAll('.state-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx === nextIndex);
            });
            
            const stateInfos = {
                idle: '💭 Idle: 미세한 호흡, 차분한 존재감',
                wake: '👁️ Wake: 집중하며 깨어남',
                thinking: '🔥 Thinking: 사고가 열로 확산되며 흐름',
                resolve: '✨ Resolve: 생각 정리 완료'
            };
            
            document.getElementById('state-info').textContent = stateInfos[currentState];
            
            if (currentState === 'resolve') {
                setTimeout(() => {
                    currentState = 'idle';
                    document.getElementById('current-state').textContent = 'IDLE';
                    document.querySelectorAll('.state-btn').forEach((btn, idx) => {
                        btn.classList.toggle('active', idx === 0);
                    });
                    document.getElementById('state-info').textContent = stateInfos.idle;
                }, 3000);
            }
        }

        // Start animation
        init();
    </script>
</body>
</html>
